[package]
name = "inat"
version = "1.0.0"
edition = "2024"
description = "A convenient portable frontend for yt-dlp and FFmpeg"

# The core is a library so the terminal and the window are two thin front ends
# over one downloader, rather than two copies of it.
[lib]
name = "inat"
path = "src/lib.rs"

[[bin]]
name = "inat"
path = "src/bin/inat.rs"

[[bin]]
name = "inat-gui"
path = "src/bin/inat-gui.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = ["gui"]
# `cargo build --no-default-features --bin inat` still builds the CLI with no
# dependencies at all, which is how it shipped before the window existed.
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
lto = true
codegen-units = 1
strip = true
